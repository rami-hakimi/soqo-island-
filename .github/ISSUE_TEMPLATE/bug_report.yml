name: Bug report
description: Something in Soqo Island does not work as described
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Security problems should **not** be filed here; use the
        private "Report a vulnerability" form described in SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: Soqo Island version
      description: Shown at the bottom of the Settings sidebar and in Settings › About.
      placeholder: 2.0.0-beta.2
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Settings › System › About, or run `winver`.
      placeholder: Windows 11 24H2 (26100)
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Interface language
      options:
        - English
        - Arabic (العربية)
        - Dutch (Nederlands)
        - Automatic
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Settings › Timer
        2. Choose Large
        3. Start a 5-minute timer
        4. …
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log excerpt (optional)
      description: |
        Settings › Support › Copy report, or the last lines of `%APPDATA%\soqo-island\soqo.log`.
        Please remove anything private (file names, calendar entries, city).
      render: text
  - type: checkboxes
    id: context
    attributes:
      label: Context
      options:
        - label: Islamic Features are switched on (Settings › Features)
        - label: Live glass backdrop is switched off (Settings › Privacy)
        - label: More than one monitor or display scaling other than 100 %
        - label: Settings were imported from Nova Island
