# Continuous integration: every push to main and to development branches, and every pull
# request against main, must pass the verify gate, rebuild the native helper from source and
# produce an unsigned installer. Nothing here publishes; see release.yml.
name: CI

on:
  push:
    branches: [main, 'rebuild/**', 'feature/**', 'fix/**', 'release/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Verify and build (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22 (npm cache)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from the lockfile
        run: npm ci

      - name: Verify (syntax, ESLint, TypeScript, en/ar/nl parity, unit tests)
        run: npm run verify

      - name: Rebuild the native helper from source
        shell: cmd
        run: helper\build.cmd

      - name: Helper answers
        shell: pwsh
        run: |
          $json = & .\helper\soqo-helper.exe apps
          $count = ($json | ConvertFrom-Json).Count
          Write-Host "Start-menu catalogue entries: $count"
          if ($count -lt 1) { exit 1 }

      - name: Security audit of production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build the installer (unsigned, not published)
        run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Validate the build output and licence files
        run: node scripts/release-check.js

      - name: Upload the installer for testing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: soqo-island-windows-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
            dist/SHA256SUMS.txt
            helper/soqo-helper.exe
