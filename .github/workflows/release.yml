# Continuous delivery: runs only for a deliberate version tag (v2.0.0-beta.2) or a manual
# run that names an existing tag. The build job has read access only; the publish job is the
# single place with write access and refuses to touch a release or tag that already exists.
# A tag containing "-" (beta, rc) is published as a GitHub pre-release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to release, for example v2.0.0-beta.2'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Verify and build the release (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js 22 (npm cache)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from the lockfile
        run: npm ci

      - name: Tag must match package.json version
        id: meta
        shell: pwsh
        run: |
          node scripts/release-check.js --tag "$env:RELEASE_TAG" --pre
          $v = (Get-Content package.json | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Verify (syntax, ESLint, TypeScript, en/ar/nl parity, unit tests)
        run: npm run verify

      - name: Rebuild the native helper from source
        shell: cmd
        run: helper\build.cmd

      - name: Helper answers
        shell: pwsh
        run: |
          $json = & .\helper\soqo-helper.exe apps
          if (($json | ConvertFrom-Json).Count -lt 1) { exit 1 }

      - name: Security audit of production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build the installer (unsigned; signing is not configured)
        run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Validate artifacts, update metadata and licence files; write SHA-256 sums
        run: node scripts/release-check.js --tag "${{ env.RELEASE_TAG }}"

      - name: Collect release notes
        shell: pwsh
        run: |
          $v = "${{ steps.meta.outputs.version }}"
          $notes = "docs/releases/$v.md"
          if (-not (Test-Path $notes)) { Write-Error "missing release notes $notes"; exit 1 }
          Copy-Item $notes dist/RELEASE_NOTES.md

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ env.RELEASE_TAG }}
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/Soqo-Island-Setup-*.exe
            dist/Soqo-Island-Setup-*.exe.blockmap
            dist/latest.yml
            dist/SHA256SUMS.txt
            dist/RELEASE_NOTES.md

  publish:
    name: Publish the GitHub pre-release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ env.RELEASE_TAG }}
          path: files

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release $RELEASE_TAG already exists; nothing was changed"
            exit 1
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          ls -l files
          flags=()
          case "$RELEASE_TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Soqo Island $VERSION" \
            --notes-file files/RELEASE_NOTES.md \
            "${flags[@]}" \
            files/Soqo-Island-Setup-*.exe \
            files/Soqo-Island-Setup-*.exe.blockmap \
            files/latest.yml \
            files/SHA256SUMS.txt
          echo "published $RELEASE_TAG (unsigned installer; SmartScreen will warn until code signing is configured)"
