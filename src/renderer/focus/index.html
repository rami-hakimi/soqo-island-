<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>Focus Mode</title>
  <link rel="stylesheet" href="focus.css">
</head>
<body>
  <main id="fm" class="fm" data-phase="">
    <header class="top">
      <div class="brand"><img src="../../../build/icon.png" alt="" aria-hidden="true"><span data-i18n="app.name">Soqo Island</span></div>
      <button id="exit" class="ghost" data-i18n-title="fm.exit" title="Exit Focus Mode"><span data-i18n="fm.exit">Exit Focus Mode</span><kbd data-i18n="fm.esc">Esc</kbd></button>
    </header>

    <!-- a coding agent needs you (only with Settings › Connections › Also in Focus Mode) -->
    <div id="fm-alert" class="fm-alert" role="status" aria-live="polite" hidden>
      <span id="fm-alert-text" dir="auto"></span>
      <button id="fm-alert-open" class="btn" hidden><span data-i18n="act.openTerminalBtn">Open terminal</span></button>
      <button id="fm-alert-x" class="ghost" aria-label="Close" data-i18n-aria="common.close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>

    <section class="stage" aria-live="polite">
      <div id="label" class="label" data-i18n="fm.timer">Timer</div>
      <div id="digits" class="digits" role="timer" aria-live="off">0:00</div>
      <div id="status" class="status"></div>
      <div class="bar" aria-hidden="true"><b id="bar"></b></div>
    </section>

    <!-- a timer is set: pause / resume, cancel -->
    <section id="controls" class="controls" hidden>
      <button id="toggle" class="btn primary"><svg class="pause" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg><svg class="play" viewBox="0 0 24 24"><path d="M8 5.6v12.8a1 1 0 0 0 1.5.86l10.2-6.4a1 1 0 0 0 0-1.72L9.5 4.74A1 1 0 0 0 8 5.6Z"/></svg><span id="toggle-text" data-i18n="timer.pause">Pause</span></button>
      <button id="cancel" class="btn danger"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg><span data-i18n="fm.cancel">Cancel timer</span></button>
    </section>

    <!-- nothing running: the same presets as the island's Timer tab -->
    <section id="presets" class="presets" hidden>
      <p data-i18n="fm.pick">Pick a time</p>
      <div class="row">
        <button class="btn" data-min="5">5<small data-i18n="timer.min">m</small></button>
        <button class="btn" data-min="10">10<small data-i18n="timer.min">m</small></button>
        <button class="btn" data-min="25">25<small data-i18n="timer.min">m</small></button>
        <button class="btn" data-min="45">45<small data-i18n="timer.min">m</small></button>
        <button id="session" class="btn accent"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4M9 2h6M17.5 6.5 19 5"/></svg><span data-i18n="fm.session">Focus session</span></button>
      </div>
    </section>

    <footer class="hint" data-i18n="fm.hint">Space pauses · Esc leaves Focus Mode; the timer keeps running</footer>
  </main>
  <script src="../../shared/i18n.js"></script>
  <script src="focus.js"></script>
</body>
</html>
